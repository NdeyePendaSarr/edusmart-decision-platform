# =============================================================================
# EduSmart Decision Platform — Infrastructure Docker (Lot L0)
# -----------------------------------------------------------------------------
# 6 services :
#   pg_source : PostgreSQL 15  — Source 1 « Gestion académique » (edusmart_academic)
#   pg_dw     : PostgreSQL 15  — Data Warehouse (edusmart_dw : staging/clean/dw/meta/quality)
#   mysql     : MySQL 8.0      — Source 2 « Plateforme pédagogique » (edusmart_learning)
#   mongo     : MongoDB 6.0    — Source 4 « Journaux de l'application mobile »
#   redis     : Redis 7        — Source 5 « Plateforme temps réel »
#   adminer   : interface web d'administration (PostgreSQL / MySQL)
# La Source 3 (CSV RH) ne nécessite aucun service : ce sont des fichiers.
#
# Lancement (depuis le dossier docker/) :
#   docker compose up -d
# Les variables sont lues dans docker/.env (copie de .env.example).
# La syntaxe ${VAR:?message} fait échouer le démarrage si un mot de passe manque.
# =============================================================================

name: edusmart

services:

  # ---------------------------------------------------------------------------
  # Source 1 — PostgreSQL « Gestion académique »
  # ---------------------------------------------------------------------------
  pg_source:
    image: postgres:15
    container_name: edusmart_pg_source
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_SOURCE_DB:-edusmart_academic}
      POSTGRES_USER: ${PG_SOURCE_USER:-edusmart}
      POSTGRES_PASSWORD: ${PG_SOURCE_PASSWORD:?PG_SOURCE_PASSWORD manquant dans docker/.env}
      TZ: ${TZ:-Africa/Dakar}
      PGTZ: ${TZ:-Africa/Dakar}
    ports:
      - "${PG_SOURCE_PORT:-5435}:5432"      # 5435 côté Windows : 5432 (PostgreSQL local) et 5433 (autre projet) sont occupés
    volumes:
      - pg_source_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [edusmart_net]

  # ---------------------------------------------------------------------------
  # Data Warehouse — PostgreSQL séparé (simule un système distinct des sources)
  # ---------------------------------------------------------------------------
  pg_dw:
    image: postgres:15
    container_name: edusmart_pg_dw
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DW_DB:-edusmart_dw}
      POSTGRES_USER: ${PG_DW_USER:-edusmart_dw}
      POSTGRES_PASSWORD: ${PG_DW_PASSWORD:?PG_DW_PASSWORD manquant dans docker/.env}
      TZ: ${TZ:-Africa/Dakar}
      PGTZ: ${TZ:-Africa/Dakar}
    ports:
      - "${PG_DW_PORT:-5434}:5432"          # Port utilisé par Power BI
    volumes:
      - pg_dw_data:/var/lib/postgresql/data
      # Scripts exécutés UNIQUEMENT au premier démarrage (volume vide)
      - ./init/pg_dw:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [edusmart_net]

  # ---------------------------------------------------------------------------
  # Source 2 — MySQL « Plateforme pédagogique »
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0                        # >= 8.0.16 : CHECK appliqués / NOT ENFORCED disponible
    container_name: edusmart_mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --local-infile=1                    # chargements en masse (LOAD DATA) en L2
    environment:
      MYSQL_DATABASE: ${MYSQL_DB:-edusmart_learning}
      MYSQL_USER: ${MYSQL_USER:-edusmart}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD manquant dans docker/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD manquant dans docker/.env}
      TZ: ${TZ:-Africa/Dakar}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [edusmart_net]

  # ---------------------------------------------------------------------------
  # Source 4 — MongoDB « Journaux de l'application mobile »
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:6.0
    container_name: edusmart_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-edusmart}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD manquant dans docker/.env}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-edusmart_mobile}
      TZ: ${TZ:-Africa/Dakar}
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [edusmart_net]

  # ---------------------------------------------------------------------------
  # Source 5 — Redis « Plateforme temps réel »
  # Persistance désactivée : Redis est volatile par nature (PDF Source 5) et le
  # snapshot est régénéré par graine fixe avant chaque extraction (point 6 validé).
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: edusmart_redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD manquant dans docker/.env}
      - --appendonly
      - "no"
      - --save
      - ""
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: ${TZ:-Africa/Dakar}
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [edusmart_net]

  # ---------------------------------------------------------------------------
  # Adminer — http://localhost:8081 (serveur : pg_source, pg_dw ou mysql)
  # 8081 côté Windows : 8080 est occupé par Airflow (autre projet)
  # ---------------------------------------------------------------------------
  adminer:
    image: adminer:4
    container_name: edusmart_adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: pg_source
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      pg_source: { condition: service_healthy }
      pg_dw:     { condition: service_healthy }
      mysql:     { condition: service_healthy }
    networks: [edusmart_net]

networks:
  edusmart_net:
    driver: bridge

volumes:
  pg_source_data:
  pg_dw_data:
  mysql_data:
  mongo_data:
