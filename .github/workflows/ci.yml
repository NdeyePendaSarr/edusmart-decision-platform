# CI EduSmart Decision Platform
# Lance les tests unitaires à chaque push et pull request.
# Les tests d'intégration (qui exigent PostgreSQL, MySQL, MongoDB et Redis)
# sont ignorés automatiquement : ils ne s'exécutent que si EDUSMART_INTEGRATION=1.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests-unitaires:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer les tests unitaires
        run: python -m pytest -q
