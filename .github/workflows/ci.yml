# CI EduSmart Decision Platform
# Lance les tests unitaires à chaque push et pull request.
# Les tests d'intégration (qui exigent PostgreSQL, MySQL, MongoDB et Redis)
# sont ignorés automatiquement : ils ne s'exécutent que si EDUSMART_INTEGRATION=1.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests-unitaires:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer les tests unitaires
        run: python -m pytest -q
